<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid练习-复刻b站部分</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #f1f2f3;
            font-family: "微软雅黑", sans-serif;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 10px;
        }

        /* 顶部导航 */
        .header {
            display: grid;
            grid-template-columns: auto 1fr auto;
            gap: 20px;
            align-items: center;
            background: white;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .header-left {
            display: grid;
            grid-template-columns: auto auto;
            gap: 15px;
        }

        .tab {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .tab.active {
            background: #fb7299;
            color: white;
        }

        /* 中间分区标签 */
        .header-nav {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(60px, auto));
            gap: 8px 15px;
            font-size: 14px;
            color: #61666d;
        }

        .header-nav span {
            cursor: pointer;
            text-align: center;
        }

        .more {
            color: #00aeec;
        }

        /* 右侧功能区 */
        .header-right {
            display: grid;
            grid-template-columns: repeat(3, auto);
            gap: 10px 15px;
            font-size: 14px;
            color: #61666d;
        }

        /* 主内容区 */
        .main-content {
            display: grid;
            /* 4列：1个大banner + 3个视频列 */
            grid-template-columns: 2fr 1fr 1fr 1fr;
            grid-auto-rows: minmax(180px, auto);
            gap: 15px;
        }

        /* 大banner：纵向跨2行 */
        .banner {
            grid-row: span 2;
            background: rgb(238, 159, 172);
            border-radius: 8px;
            position: relative;
            color: white;
            display: flex;
            align-items: flex-end;
            padding: 20px;
        }

        .banner p {
            font-size: 20px;
            font-weight: bold;
        }
    
        /* 视频卡片 */
        .video-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 8px;
            padding-bottom: 10px;
        }

        .card-cover {
            width: 100%;
            height: 120px;
            background: #bbbbbb;
        }

        .card-title {
            font-size: 14px;
            font-weight: normal;
            padding: 0 8px;
            line-height: 1.4;
        }

        .card-info {
            font-size: 12px;
            color: #999;
            padding: 0 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 顶部导航栏 -->
        <header class="header">
            <div class="header-left">
                <span class="tab">动态</span>
                <span class="tab active">热门</span>
            </div>

            <div class="header-nav">
                <span>番剧</span>
                <span>国创</span>
                <span>综艺</span>
                <span>动画</span>
                <span>鬼畜</span>
                <span>舞蹈</span>
                <span>娱乐</span>
                <span>科技数码</span>
                <span>美食</span>
                <span>汽车</span>
                <span>体育运动</span>
                <span>电影</span>
                <span>电视剧</span>
                <span>纪录片</span>
                <span>游戏</span>
                <span>音乐</span>
                <span>影视</span>
                <span>知识</span>
                <span>资讯</span>
                <span>小剧场</span>
                <span>时尚美妆</span>
                <span class="more">更多</span>
            </div>

            <div class="header-right">
                <span>专栏</span>
                <span>活动</span>
                <span>社区中心</span>
                <span>直播</span>
                <span>课堂</span>
                <span>新歌热榜</span>
            </div>
        </header>

        <!-- 主内容网格 -->
        <main class="main-content">
            <!-- 大Banner -->
            <div class="banner">
                <p>恭喜获得冠军</p>
                <div class="banner-dots">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>
            </div>

            <!-- 视频卡片 1 -->
            <div class="video-card">
                <div class="card-cover"></div>
                <h3 class="card-title">全世界笑点下降1000倍而我不变</h3>
                <p class="card-info">逗比的雀巢 · 05-23</p>
            </div>

            <!-- 视频卡片 2 -->
            <div class="video-card">
                <div class="card-cover"></div>
                <h3 class="card-title"></h3>
                <p class="card-info"></p>
            </div>

            <!-- 视频卡片 3 -->
            <div class="video-card">
                <div class="card-cover"></div>
                <h3 class="card-title"></h3>
                <p class="card-info"></p>
            </div>

            <!-- 视频卡片 4 -->
            <div class="video-card">
                <div class="card-cover"></div>
                <h3 class="card-title"></h3>
                <p class="card-info"></p>
            </div>

            <!-- 视频卡片 5 -->
            <div class="video-card">
                <div class="card-cover"></div>
                <h3 class="card-title"></h3>
                <p class="card-info"></p>
            </div>

            <!-- 视频卡片 6 -->
            <div class="video-card">
                <div class="card-cover"></div>
                <h3 class="card-title"></h3>
                <p class="card-info"></p>
            </div>
        </main>
    </div>
</body>
</html>
